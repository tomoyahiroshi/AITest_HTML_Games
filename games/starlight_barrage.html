<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starlight Barrage</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #11193a 0%, #05070f 55%, #030308 100%);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #d8e7ff;
    }
    .wrap {
      padding: 16px;
      border: 1px solid #335;
      border-radius: 10px;
      background: rgba(8, 10, 18, 0.88);
      box-shadow: 0 0 30px rgba(80, 110, 255, 0.25);
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      border: 1px solid #3e4f8f;
      background: #050814;
    }
    .help {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.85;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="480" height="640"></canvas>
    <div class="help">Move: WASD / Arrow Keys ・ Shot: Space(hold) ・ Start: Space / Enter / Click ・ Retry: R</div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      const PHASE_MID_A = 'PHASE_MID_A';
      const PHASE_MID_BOSS = 'PHASE_MID_BOSS';
      const PHASE_MID_B = 'PHASE_MID_B';
      const PHASE_STAGE_BOSS = 'PHASE_STAGE_BOSS';
      const PHASE_CLEAR_TRANSITION = 'PHASE_CLEAR_TRANSITION';
      const MID_AB_DURATION_SCALE = 1.5;
      const SMALL_FODDER_SPAWN_MULTIPLIER = 1.5;

      function midABFrame(baseFrame) {
        return Math.round(baseFrame * MID_AB_DURATION_SCALE);
      }

      function phaseLabel(phase) {
        if (phase === PHASE_MID_A) return `LOOP ${state.loop} AREA A`;
        if (phase === PHASE_MID_BOSS) return 'MID BOSS';
        if (phase === PHASE_MID_B) return `LOOP ${state.loop} AREA B`;
        if (phase === PHASE_STAGE_BOSS) return 'STAGE BOSS';
        if (phase === PHASE_CLEAR_TRANSITION) return 'STAGE CLEAR';
        return 'UNKNOWN';
      }

      const keys = Object.create(null);
      const prevKeys = Object.create(null);
      addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
          e.preventDefault();
        }
      });
      addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      const mouse = {
        x: 0,
        y: 0,
        clicked: false
      };
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * W;
        mouse.y = ((e.clientY - rect.top) / rect.height) * H;
      });
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * W;
        mouse.y = ((e.clientY - rect.top) / rect.height) * H;
        mouse.clicked = true;
      });

      const state = {
        loop: 1,
        score: 0,
        lives: 3,
        inTitle: true,
        debugMode: false,
        frame: 0,
        gameOver: false,
        phase: PHASE_MID_A,
        phaseFrame: 0,
        phaseTextTimer: 120,
        warningTimer: 0,
        transitionTimer: 0,
        phaseEnemySpawned: 0,
        phaseEnemyDefeated: 0,
        midBossSpawnTimer: -1,
        stageBossSpawnTimer: -1,
        stageBossDeployTimer: -1,
        stageBossHasSpawned: false,
        playerBullets: [],
        enemyBullets: [],
        enemies: [],
        stars: [],
        explosions: [],
        maxEnemyBullets: 550,
        smallFodderSpawnCarry: 0
      };

      const player = {
        x: W / 2,
        y: H - 80,
        targetY: H - 80,
        speed: 4,
        radius: 3.5,
        shootCd: 0,
        invincible: 0,
        flash: false,
        debugInvincible: false,
        respawnState: 'active',
        respawnTimer: 0,
        respawnEnterDuration: 52
      };

      const ENEMY_HIT_RADIUS = {
        small: 14,
        medium: 28,
        turret: 20,
        boss: 40
      };

      const titleButtons = {
        start: { x: W / 2, y: 332, w: 250, h: 54 },
        debug: { x: W - 66, y: H - 24, w: 108, h: 28 }
      };

      for (let i = 0; i < 90; i++) {
        state.stars.push({ x: Math.random() * W, y: Math.random() * H, s: 0.5 + Math.random() * 2 });
      }

      function diffRate(baseRate, perLoop) {
        const l = Math.min(state.loop - 1, 10);
        return baseRate * (1 + perLoop * l);
      }

      function loopIntensity(step = 0.1) {
        return 0.1 + Math.max(0, state.loop - 1) * step;
      }

      function scaledBossHp(baseHp) {
        const baseScaledHp = baseHp * loopIntensity(0.1);
        const lowLoopBoost = Math.max(1, 5 - (state.loop - 1) * 1.5);
        return Math.max(20, Math.floor(baseScaledHp * lowLoopBoost));
      }

      function scaledBulletCount(baseCount) {
        return Math.max(1, Math.floor(baseCount * loopIntensity(0.1)));
      }

      function scaledShotInterval(baseInterval) {
        return Math.max(8, Math.floor(baseInterval / loopIntensity(0.1)));
      }

      function scaledBossShotInterval(baseInterval) {
        const intensity = Math.min(1.2, 0.55 + (state.loop - 1) * 0.08);
        return Math.max(8, Math.floor(baseInterval / intensity));
      }

      function bossAttackTick(enemy, baseInterval) {
        const interval = scaledBossShotInterval(baseInterval);
        return enemy.t === 1 || enemy.t % interval === 0;
      }

      function midBossAttackTick(enemy, baseInterval) {
        return bossAttackTick(enemy, Math.floor(baseInterval * 1.3));
      }

      function isPressed(code) {
        return !!keys[code] && !prevKeys[code];
      }

      function beginGame(debugStart) {
        state.loop = 1;
        state.score = 0;
        state.lives = 3;
        state.gameOver = false;
        state.inTitle = false;
        state.debugMode = debugStart;
        changePhase(PHASE_MID_A);
        state.playerBullets.length = 0;
        state.enemyBullets.length = 0;
        state.enemies.length = 0;
        player.x = W / 2;
        player.y = player.targetY;
        player.invincible = 120;
        player.debugInvincible = debugStart;
        player.respawnState = 'active';
        player.respawnTimer = 0;
      }

      function resetForRetry() {
        beginGame(state.debugMode);
      }

      function addScore(value) {
        state.score += value;
      }

      function clamp(v, mn, mx) {
        return Math.max(mn, Math.min(mx, v));
      }

      function distanceSq(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return dx * dx + dy * dy;
      }

      function isSmallFodderEnemy(enemy) {
        return !enemy.type?.includes('Boss') && enemy.hp === 1 && enemy.sizeClass !== 'medium';
      }

      function spawnEnemy(enemy, options = {}) {
        const { allowBonus = true } = options;
        const spawned = { alive: true, t: 0, hitShake: 0, hitShakeMag: 0, ...enemy };
        state.enemies.push(spawned);
        if (!spawned.type.includes('Boss') && (state.phase === PHASE_MID_A || state.phase === PHASE_MID_B)) {
          state.phaseEnemySpawned++;
        }

        if (!allowBonus || SMALL_FODDER_SPAWN_MULTIPLIER <= 1 || !isSmallFodderEnemy(spawned)) return;
        state.smallFodderSpawnCarry += SMALL_FODDER_SPAWN_MULTIPLIER - 1;
        if (state.smallFodderSpawnCarry >= 1) {
          state.smallFodderSpawnCarry -= 1;
          const cloneOffset = (Math.random() - 0.5) * 26;
          spawnEnemy({
            ...enemy,
            x: enemy.x + cloneOffset,
            y: enemy.y - 14
          }, { allowBonus: false });
        }
      }

      function shootEnemyBullet(x, y, vx, vy, r = 4, color = '#ff578f') {
        if (state.enemyBullets.length >= state.maxEnemyBullets) return;
        state.enemyBullets.push({ x, y, vx, vy, r, color, alive: true });
      }

      function ringBullets(x, y, count, speed, shift = 0, color = '#ff6cb2') {
        for (let i = 0; i < count; i++) {
          const a = shift + (Math.PI * 2 * i) / count;
          shootEnemyBullet(x, y, Math.cos(a) * speed, Math.sin(a) * speed, 4, color);
        }
      }

      function aimedShot(x, y, speed, spread = 0) {
        const angle = Math.atan2(player.y - y, player.x - x) + spread;
        shootEnemyBullet(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 4, '#ffc56b');
      }

      function spawnExplosion(x, y, options = {}) {
        const {
          count = 18,
          speed = 2.8,
          spread = 1,
          life = 34,
          colors = ['#ffd9a6', '#ff8fb1', '#fff3d8'],
          radius = 2.5,
          gravity = 0.02
        } = options;

        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.35;
          const mag = (0.45 + Math.random() * 0.8) * speed;
          state.explosions.push({
            x,
            y,
            vx: Math.cos(angle) * mag * spread,
            vy: Math.sin(angle) * mag,
            age: 0,
            life: life + Math.floor(Math.random() * 10),
            r: radius * (0.7 + Math.random() * 0.8),
            gravity,
            color: colors[(Math.random() * colors.length) | 0]
          });
        }
      }

      function spawnHitEffect(x, y, strong = false) {
        spawnExplosion(x, y, {
          count: strong ? 12 : 8,
          speed: strong ? 2.3 : 1.8,
          life: strong ? 20 : 16,
          radius: strong ? 2.2 : 1.6,
          gravity: 0,
          colors: strong
            ? ['#fff4bf', '#ffb8de', '#9ad9ff']
            : ['#fff4bf', '#ffc8da', '#9ed7ff']
        });
      }

      function spawnSkirmisherWave(count = 5, yStart = 90) {
        for (let i = 0; i < count; i++) {
          const fromLeft = i % 2 === 0;
          spawnEnemy({
            type: 'skirmisher',
            x: fromLeft ? -30 : W + 30,
            y: yStart + i * 34,
            hp: 1,
            value: 110,
            update(e) {
              e.t++;
              const sway = Math.sin((e.t + i * 20) / 16) * 1.6;
              e.x += fromLeft ? 1.9 + sway * 0.15 : -1.9 + sway * 0.15;
              e.y += 0.55 + Math.cos((e.t + i * 10) / 28) * 0.35;
              if (e.t % scaledShotInterval(82) === 0) {
                aimedShot(e.x, e.y, diffRate(1.25, 0.03), fromLeft ? 0.09 : -0.09);
              }
            },
            draw(e) {
              drawAscii(['<*>', ' v '], e.x, e.y, '#a3ffe8', 13);
            }
          });
        }
      }

      function spawnSniperPair() {
        for (let i = 0; i < 2; i++) {
          const anchorX = 90 + i * 300;
          const centerY = H * 0.46 + i * 18;
          const retreatY = H - 130 + i * 22;
          spawnEnemy({
            type: 'sniper',
            sizeClass: 'medium',
            x: anchorX,
            y: -50 - i * 35,
            hp: Math.floor(diffRate(20, 0.05)),
            value: 680,
            update(e) {
              e.t++;
              if (e.t < 120) {
                e.y += (centerY - e.y) * 0.08;
                e.x += (anchorX - e.x) * 0.06;
              } else if (e.t < 260) {
                e.y += Math.sin((e.t + i * 25) / 40) * 0.24;
                e.x += Math.sin((e.t + i * 10) / 55) * 0.65;
              } else if (e.t < 380) {
                const retreatX = i === 0 ? W * 0.27 : W * 0.73;
                e.y += (retreatY - e.y) * 0.05;
                e.x += (retreatX - e.x) * 0.045;
              } else {
                e.y += 1.05;
                e.x += i === 0 ? -0.3 : 0.3;
              }

              if (e.t === 140 || e.t % scaledShotInterval(30) === 0) {
                for (let n = -2; n <= 2; n++) aimedShot(e.x, e.y + 10, diffRate(1.55, 0.03), n * 0.1);
              }
              if (e.t === 210 || e.t % scaledShotInterval(56) === 0) {
                ringBullets(e.x, e.y + 12, scaledBulletCount(8), diffRate(0.95, 0.03), e.t * 0.03, '#6ec9ff');
              }
              if (e.t > 520) e.alive = false;
            },
            draw(e) {
              drawAscii([
                ' /====\\ ',
                '<( <> )>',
                ' \\_||_/ '
              ], e.x, e.y, '#7dc8ff', 15);
            }
          });
        }
      }

      function spawnDiverLine() {
        for (let i = 0; i < 6; i++) {
          spawnEnemy({
            type: 'diver',
            x: 45 + i * 55,
            y: -20 - i * 16,
            hp: 1,
            value: 150,
            update(e) {
              e.t++;
              e.y += 2.05;
              e.x += Math.sin((e.t + i * 30) / 15) * 1.7;
              if (e.t % scaledShotInterval(88) === 0) {
                shootEnemyBullet(e.x, e.y, Math.sin((e.t + i * 12) / 17) * 0.8, diffRate(1.7, 0.03), 4, '#ff8bb8');
              }
            },
            draw(e) {
              drawAscii(['\\|/', ' V '], e.x, e.y, '#ffb3d1', 12);
            }
          });
        }
      }

      function spawnWaveA() {
        spawnSkirmisherWave();
        spawnSniperPair();
      }

      function spawnWaveAColumnRush() {
        const candidates = [50, 90, 130, 170, 210, 250, 290, 330, 370, 410, 450]
          .sort(() => Math.random() - 0.5);
        const laneCount = 8;
        for (let i = 0; i < laneCount; i++) {
          const baseLane = candidates[i % candidates.length];
          const laneX = clamp(baseLane + (Math.random() - 0.5) * 24, 38, W - 38);
          const startY = -28 - i * (18 + Math.random() * 20);
          spawnEnemy({
            type: 'midAColumnRush',
            x: laneX,
            y: startY,
            hp: 1,
            value: 120,
            update(e) {
              e.t++;
              e.y += 2.35;
              e.x += Math.sin((e.t + i * 16) / 22) * 0.35;
              if (e.t % scaledShotInterval(112) === 0) {
                aimedShot(e.x, e.y, diffRate(1.22, 0.03));
              }
            },
            draw(e) {
              drawAscii(['[|]', ' v '], e.x, e.y, '#ffd2a1', 12);
            }
          });
        }
      }

      function spawnWaveAAlt() {
        spawnDiverLine();
        for (let i = 0; i < 4; i++) {
          const fromLeft = i % 2 === 0;
          const retreatVx = fromLeft ? -2.3 : 2.3;
          spawnEnemy({
            type: 'striker',
            x: fromLeft ? -28 : W + 28,
            y: 85 + i * 50,
            hp: 1,
            value: 140,
            update(e) {
              e.t++;
              const trackingWindow = 600;
              if (e.t <= trackingWindow) {
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * 1.25;
                e.y += Math.sin(angle) * 1.25;
                if (e.t % scaledShotInterval(60) === 0) aimedShot(e.x, e.y, diffRate(1.6, 0.03));
              } else {
                e.x += retreatVx;
                e.y -= 2.2;
              }
            },
            draw(e) {
              drawAscii([' v ', '<x>'], e.x, e.y, '#b8ffcf', 14);
            }
          });
        }
      }

      function spawnWaveAFormationSweep() {
        const columns = 4;
        for (let i = 0; i < columns * 2; i++) {
          const row = Math.floor(i / columns);
          const col = i % columns;
          spawnEnemy({
            type: 'midAFormationSweep',
            x: row === 0 ? -45 - col * 26 : W + 45 + col * 26,
            y: 110 + col * 40,
            hp: 1,
            value: 170,
            update(e) {
              e.t++;
              const dir = row === 0 ? 1 : -1;
              e.x += dir * 2.15;
              e.y += Math.sin((e.t + col * 18) / 20) * 0.7;
              if (e.t % scaledShotInterval(96) === 0) {
                aimedShot(e.x, e.y, diffRate(1.45, 0.03), dir * 0.05);
              }
            },
            draw(e) {
              drawAscii([' + ', '/#\\'], e.x, e.y, '#ffb5f3', 13);
            }
          });
        }
      }

      function spawnWaveAFormationDrop() {
        for (let i = 0; i < 8; i++) {
          const row = Math.floor(i / 4);
          const col = i % 4;
          spawnEnemy({
            type: 'midAFormationDrop',
            x: 80 + col * 105,
            y: -35 - row * 36,
            hp: 1,
            value: 165,
            update(e) {
              e.t++;
              e.y += 1.8;
              e.x += Math.sin((e.t + row * 20) / 15) * 1.15;
              if (e.t % scaledShotInterval(84) === 0) {
                const spread = (col - 1.5) * 0.06;
                aimedShot(e.x, e.y, diffRate(1.35, 0.03), spread);
              }
            },
            draw(e) {
              drawAscii(['[+]', ' v '], e.x, e.y, '#ff9ac9', 13);
            }
          });
        }
      }

      function spawnWaveB() {
        for (let i = 0; i < 12; i++) {
          const fromLeft = i < 6;
          const row = i % 6;
          spawnEnemy({
            type: 'formation',
            x: fromLeft ? -30 - row * 24 : W + 30 + row * 24,
            y: 110 + row * 45,
            hp: 1,
            value: 150,
            update(e) {
              e.t++;
              e.x += fromLeft ? 2.6 : -2.6;
              e.y += Math.sin((e.t + row * 16) / 26) * 0.5;
              if (e.t % scaledShotInterval(110) === 0) {
                aimedShot(e.x, e.y, diffRate(1.45, 0.03));
              }
            },
            draw(e) {
              drawAscii([' + ', '\\v/'], e.x, e.y, '#ffb0df', 13);
            }
          });
        }
      }

      function spawnWaveC() {
        for (let i = 0; i < 12; i++) {
          spawnEnemy({
            type: 'formationAlt',
            x: 30 + (i % 6) * 82,
            y: -20 - Math.floor(i / 6) * 95,
            hp: 1,
            value: 180,
            update(e) {
              e.t++;
              e.y += 1.9;
              e.x += Math.sin((e.t + i * 20) / 18) * 1.8;
              if (e.t % scaledShotInterval(95) === 0) {
                ringBullets(e.x, e.y, scaledBulletCount(6), diffRate(1.2, 0.03), e.t * 0.06);
              }
            },
            draw(e) {
              drawAscii(['{+}', '/v\\'], e.x, e.y, '#ffa0c7', 13);
            }
          });
        }
      }

      function spawnWaveBMix() {
        for (let i = 0; i < 6; i++) {
          spawnEnemy({
            type: 'midBMixSkirm',
            x: i % 2 === 0 ? -24 : W + 24,
            y: 85 + i * 42,
            hp: 1,
            value: 170,
            update(e) {
              e.t++;
              const fromLeft = i % 2 === 0;
              e.x += fromLeft ? 2.15 : -2.15;
              e.y += Math.cos((e.t + i * 18) / 22) * 0.8;
              if (e.t % scaledShotInterval(78) === 0) {
                aimedShot(e.x, e.y, diffRate(1.55, 0.03), fromLeft ? 0.08 : -0.08);
              }
            },
            draw(e) {
              drawAscii(['<+>', ' | '], e.x, e.y, '#8ff2ff', 13);
            }
          });
        }

        for (let i = 0; i < 3; i++) {
          const fromLeft = i % 2 === 0;
          spawnEnemy({
            type: 'midBMixGuard',
            sizeClass: 'medium',
            x: fromLeft ? -45 : W + 45,
            y: 150 + i * 70,
            hp: Math.floor(diffRate(16, 0.05)),
            value: 420,
            update(e) {
              e.t++;
              e.x += fromLeft ? 0.68 : -0.68;
              e.y += Math.sin((e.t + i * 30) / 32) * 0.22;
              if (e.t === 90 || e.t % scaledShotInterval(34) === 0) {
                const sideOffset = fromLeft ? 0.1 : -0.1;
                aimedShot(e.x, e.y + 4, diffRate(1.45, 0.03), sideOffset);
                aimedShot(e.x, e.y + 4, diffRate(1.45, 0.03), -sideOffset);
                for (let spread = -2; spread <= 2; spread++) {
                  aimedShot(e.x, e.y + 8, diffRate(1.55, 0.03), spread * 0.09);
                }
              }
              if (e.t === 150 || e.t % scaledShotInterval(72) === 0) {
                ringBullets(e.x, e.y + 8, scaledBulletCount(8), diffRate(0.95, 0.03), -e.t * 0.04, '#9fe2ff');
              }
            },
            draw(e) {
              drawAscii([' /MMM\\ ', '<|##|>', ' \\__/ '], e.x, e.y, '#7fbeff', 16);
            }
          });
        }
      }

      function spawnMidBoss() {
        const variant = (state.loop - 1) % 5;
        spawnEnemy({
          type: `midBossV${variant + 1}`,
          x: W / 2,
          y: -130,
          introTargetY: 100,
          hp: scaledBossHp(Math.floor(diffRate(320, 0.08))),
          maxHp: scaledBossHp(Math.floor(diffRate(320, 0.08))),
          value: 3000,
          update(e) {
            if (!e.entered) {
              e.t++;
              const p = Math.min(1, e.t / 65);
              const eased = 1 - (1 - p) * (1 - p);
              e.y = -130 + (e.introTargetY + 130) * eased;
              if (p < 1) return;
              e.entered = true;
              e.t = 0;
              e.y = e.introTargetY;
            }
            e.t++;
            const rage = e.hp < e.maxHp * 0.5;
            const speedMul = diffRate(1.25, 0.02) * (rage ? 1.12 : 1);
            const midBossBulletCount = (baseCount) => Math.max(1, Math.floor(scaledBulletCount(baseCount) * 0.8));

            if (variant === 0) {
              e.x = W / 2 + Math.sin(e.t / 60) * 120;
              if (midBossAttackTick(e, rage ? 38 : 48)) {
                aimedShot(e.x, e.y + 8, speedMul, 0);
                aimedShot(e.x, e.y + 8, speedMul, 0.14);
                aimedShot(e.x, e.y + 8, speedMul, -0.14);
              }
              if (midBossAttackTick(e, rage ? 16 : 20)) {

      function spawnStageBoss() {
        const variant = (state.loop - 1) % 5;
        spawnEnemy({
          type: `stageBossV${variant + 1}`,
          x: W / 2,
          y: -150,
          introTargetY: 110,
          hp: scaledBossHp(Math.floor(diffRate(680, 0.08))),
          maxHp: scaledBossHp(Math.floor(diffRate(680, 0.08))),
          value: 10000,
          update(e) {
            if (!e.entered) {
              e.t++;
              const p = Math.min(1, e.t / 75);
              const eased = 1 - (1 - p) * (1 - p);
              e.y = -150 + (e.introTargetY + 150) * eased;
              if (p < 1) return;
              e.entered = true;
              e.t = 0;
              e.y = e.introTargetY;
            }
            e.t++;
            const p = e.hp / e.maxHp;
            const phase = p > 0.66 ? 1 : p > 0.33 ? 2 : 3;
            const speed = diffRate(1.45, 0.03);
            const opening = e.t < 180;

            if (opening && bossAttackTick(e, 22)) {
              for (let i = -2; i <= 2; i++) {
                aimedShot(e.x, e.y + 8, speed + 0.6, i * 0.08);
              }
            }
            if (opening && bossAttackTick(e, 48)) {
              ringBullets(e.x, e.y + 6, scaledBulletCount(9), speed, e.t * 0.07, '#ffb46e');
            }

            if (variant === 0) {
              e.x = W / 2 + Math.sin(e.t / 75) * 150;
              if (phase === 1) {
                if (bossAttackTick(e, 46)) {
                  ringBullets(e.x, e.y, scaledBulletCount(18), speed, e.t * 0.04, '#73e6ff');
                  aimedShot(e.x, e.y, speed + 0.5);
                }
              } else if (phase === 2) {
                if (bossAttackTick(e, 16)) {
                  const lane = ((Math.floor(e.t / 42) % 10) - 5) * 28;
                  shootEnemyBullet(W / 2 + lane, 0, 0, speed + 1.2, 5, '#9af079');
                  shootEnemyBullet(W / 2 - lane, 0, 0, speed + 1.2, 5, '#9af079');
                }
                if (bossAttackTick(e, 34)) ringBullets(e.x, e.y + 6, scaledBulletCount(10), speed, e.t * 0.15, '#ffaa6a');
              } else {
                if (bossAttackTick(e, 20)) {
                  for (let i = 0; i < 3; i++) {
                    const shift = (e.t * 0.12) + i * 0.8;
                    ringBullets(e.x + Math.sin(shift) * 90, e.y + Math.cos(shift * 0.8) * 12, scaledBulletCount(10), speed + 0.5, shift, '#ff6cd6');
                  }
                }
                if (bossAttackTick(e, 28)) {
                  for (let i = -3; i <= 3; i++) aimedShot(e.x, e.y, speed + 1, i * 0.09);
                }
              }
            } else if (variant === 1) {
              e.x = W / 2 + Math.sin(e.t / 58) * 118;
              e.y = 102 + Math.cos(e.t / 40) * 14;
              if (phase === 1 && bossAttackTick(e, 42)) {
                for (let i = 0; i < 2; i++) ringBullets(e.x, e.y, scaledBulletCount(12), speed + i * 0.3, e.t * 0.05 + i * 0.5, '#76f7ff');
              }
              if (phase >= 2 && bossAttackTick(e, 24)) {
                for (let i = 0; i < 7; i++) {
                  const px = 40 + i * 66;
                  shootEnemyBullet(px, -8, 0, speed + 1.1, 4, '#ffdb68');
                }
              }
              if (phase === 3 && bossAttackTick(e, 18)) {
                for (let i = -4; i <= 4; i++) aimedShot(e.x, e.y + 6, speed + 1, i * 0.07);
              }
            } else if (variant === 2) {
              e.x = W / 2 + Math.sin(e.t / 90) * 170;
              if (phase === 1 && bossAttackTick(e, 36)) {
                for (let i = 0; i < 5; i++) {
                  const ox = ((i - 2) * 35);
                  ringBullets(e.x + ox, e.y + 5, scaledBulletCount(6), speed + 0.2, e.t * 0.05 + i * 0.2, '#b89dff');
                }
              }
              if (phase >= 2 && bossAttackTick(e, 30)) {
                for (let i = 0; i < 2; i++) {
                  const edgeX = i === 0 ? 20 : W - 20;
                  for (let j = 0; j < 5; j++) {
                    const ty = 60 + j * 95;
                    const angle = Math.atan2(player.y - ty, player.x - edgeX) + (j - 2) * 0.04;
                    shootEnemyBullet(edgeX, ty, Math.cos(angle) * (speed + 0.8), Math.sin(angle) * (speed + 0.8), 4, '#ff86d1');
                  }
                }
              }
              if (phase === 3 && bossAttackTick(e, 20)) {
                ringBullets(e.x, e.y + 8, scaledBulletCount(20), speed + 0.55, e.t * 0.07, '#ff6cd6');
              }
            } else if (variant === 3) {
              e.x = W / 2 + Math.sin(e.t / 66) * 145;
              e.y = 100 + Math.cos(e.t / 45) * 20;
              if (phase === 1 && bossAttackTick(e, 40)) {
                for (let i = 0; i < 3; i++) {
                  ringBullets(e.x, e.y + 6, scaledBulletCount(10 + i * 2), speed + 0.1 * i, e.t * 0.04 + i * 0.4, '#9dc0ff');
                }
              }
              if (phase >= 2 && bossAttackTick(e, 26)) {
                for (let i = -4; i <= 4; i++) aimedShot(e.x, e.y + 8, speed + 0.8, i * 0.06);
              }
              if (phase === 3 && bossAttackTick(e, 16)) {
                const shift = e.t * 0.11;
                ringBullets(e.x + Math.sin(shift) * 80, e.y + 10, scaledBulletCount(12), speed + 0.9, shift, '#7affdc');
              }
            } else {
              e.x = W / 2 + Math.sin(e.t / 52) * 95;
              if (phase === 1 && bossAttackTick(e, 34)) {
                for (let i = 0; i < 10; i++) {
                  const a = (Math.PI * 2 * i) / 10 + e.t * 0.03;
                  shootEnemyBullet(e.x, e.y + 8, Math.cos(a) * (speed + 0.4), Math.sin(a) * (speed + 0.4), 4, '#ffd76b');
                }
              }
              if (phase >= 2 && bossAttackTick(e, 24)) {
                for (let lane = 0; lane < 6; lane++) {
                  const lx = 45 + lane * 78;
                  aimedShot(lx, -6, speed + 1.1, (lane - 2.5) * 0.04);
                }
              }
              if (phase === 3 && bossAttackTick(e, 14)) {
                for (let i = 0; i < 2; i++) {
                  ringBullets(e.x, e.y + 10, scaledBulletCount(14), speed + 1.0, e.t * 0.09 + i * Math.PI * 0.5, '#ff93ea');
                }
              }
            }
          },
          draw(e) {
            const sprites = [
              ['    ==##@@##==    ', '  /%%%@@@@@@%%%\\  ', '<####|  /\\  |####>', '<@@@@| <==> |@@@@>', '  \\___\\____/___/  '],
              ['    //####\\\\    ', '  <@@@**@@**@@@>  ', '<|||||<====>|||||>', '<####| /__\\ |####>', '   \\____==____/   '],
              ['    [[@@##@@]]    ', '  <##</\\  /\\>##>  ', '<||||<::::::>||||>', '<####(  /\\  )####>', '   /____----____\\   '],
              ['    <<==@@==>>    ', '  <@@|| /\\ ||@@>  ', '<####<=====>####>', '<||||| /__\\ |||||>', '   /____====____\\   '],
              ['    {####@@####}    ', '  <@@/--/\\--\\@@>  ', '<||||<++++++>||||>', '<WWWW( /__\\ )WWWW>', '   \\____====____/   ']
            ];
            const colors = ['#ff97ba', '#8fd4ff', '#ffbf7a', '#9ef7d8', '#d3a2ff'];
            drawAscii(sprites[variant], e.x, e.y, colors[variant], 24);
            drawBossHp(e.hp, e.maxHp, '#ff87b3', 'STAGE BOSS');
          }
        });
      }

      function changePhase(next) {
        state.phase = next;
        state.phaseFrame = 0;
        state.phaseTextTimer = 120;
        if (next === PHASE_MID_A) {
          state.enemies.length = 0;
          state.enemyBullets.length = 0;
          state.phaseEnemySpawned = 0;
          state.phaseEnemyDefeated = 0;
          state.midBossSpawnTimer = -1;
          state.stageBossSpawnTimer = -1;
          state.stageBossDeployTimer = -1;
          state.stageBossHasSpawned = false;
          state.smallFodderSpawnCarry = 0;
        }
        if (next === PHASE_STAGE_BOSS) {
          state.warningTimer = 90;
          state.stageBossDeployTimer = 120;
          state.stageBossHasSpawned = false;
        }
        if (next === PHASE_MID_B) {
          state.phaseEnemySpawned = 0;
          state.phaseEnemyDefeated = 0;
          state.stageBossSpawnTimer = -1;
          state.stageBossDeployTimer = -1;
          state.stageBossHasSpawned = false;
        }
      }

      function triggerPlayerDown() {
        const deathX = player.x;
        const deathY = player.y;
        state.lives--;
        spawnExplosion(deathX, deathY, {
          count: 72,
          speed: 4.9,
          life: 68,
          radius: 4.8,
          gravity: 0.01,
          colors: ['#ffffff', '#ffd9f3', '#ff8ec9', '#92beff']
        });
        spawnExplosion(deathX, deathY, {
          count: 40,
          speed: 3.2,
          spread: 1.4,
          life: 48,
          radius: 3.3,
          gravity: 0,
          colors: ['#9ed8ff', '#b4a4ff', '#fff2be']
        });

        state.enemyBullets.length = 0;
        if (state.lives <= 0) {
          state.gameOver = true;
          player.respawnState = 'waiting';
          player.respawnTimer = 0;
          return;
        }

        player.respawnState = 'waiting';
        player.respawnTimer = 45;
        player.flash = false;
        player.invincible = 0;
      }

      function updatePlayer() {
        if (player.respawnState === 'waiting') {
          if (player.respawnTimer > 0) {
            player.respawnTimer--;
          } else {
            player.respawnState = 'entering';
            player.respawnTimer = player.respawnEnterDuration;
            player.x = W / 2;
            player.y = H + 46;
            player.invincible = player.respawnEnterDuration + 90;
          }
          return;
        }

        if (player.respawnState === 'entering') {
          const t = 1 - player.respawnTimer / Math.max(1, player.respawnEnterDuration);
          const eased = 1 - (1 - t) * (1 - t);
          player.y = H + 46 + (player.targetY - (H + 46)) * eased;
          player.respawnTimer--;
          if (player.respawnTimer <= 0) {
            player.respawnState = 'active';
            player.y = player.targetY;
          }
          if (player.invincible > 0) player.invincible--;
          return;
        }

        const left = keys.KeyA || keys.ArrowLeft;
        const right = keys.KeyD || keys.ArrowRight;
        const up = keys.KeyW || keys.ArrowUp;
        const down = keys.KeyS || keys.ArrowDown;
        let dx = (right ? 1 : 0) - (left ? 1 : 0);
        let dy = (down ? 1 : 0) - (up ? 1 : 0);
        if (dx && dy) {
          dx *= 0.7071;
          dy *= 0.7071;
        }

        player.x = clamp(player.x + dx * player.speed, 20, W - 20);
        player.y = clamp(player.y + dy * player.speed, 30, H - 25);
        player.targetY = H - 80;

        if (player.shootCd > 0) player.shootCd--;
        if ((keys.Space || keys.KeyJ) && player.shootCd <= 0 && !state.gameOver) {
          state.playerBullets.push({ x: player.x - 5, y: player.y - 14, vy: -8.5, alive: true });
          state.playerBullets.push({ x: player.x + 5, y: player.y - 14, vy: -8.5, alive: true });
          player.shootCd = 5;
          player.flash = true;
        } else {
          player.flash = false;
        }
        if (player.invincible > 0) player.invincible--;
      }

      function updatePhase() {
        state.phaseFrame++;

        if (state.phase === PHASE_MID_A) {
          if (state.phaseFrame === midABFrame(8)) spawnWaveAColumnRush();
          if (state.phaseFrame === midABFrame(20) || state.phaseFrame === midABFrame(400)) spawnWaveB();
          if (state.phaseFrame === midABFrame(140) || state.phaseFrame === midABFrame(520)) spawnWaveC();
          if (state.phaseFrame === midABFrame(640) || state.phaseFrame === midABFrame(760)) spawnWaveBMix();
          if (state.phaseFrame > midABFrame(960) && state.midBossSpawnTimer < 0 && state.phaseEnemySpawned > 0) {
            state.midBossSpawnTimer = midABFrame(75);
          }
          if (state.midBossSpawnTimer >= 0) {
            state.midBossSpawnTimer--;
          }
          if (state.midBossSpawnTimer === 0) {
            changePhase(PHASE_MID_BOSS);
            spawnMidBoss();
          }
        } else if (state.phase === PHASE_MID_BOSS) {
          if (!state.enemies.some((e) => e.alive && e.type.startsWith('midBoss'))) {
            changePhase(PHASE_MID_B);
          }
        } else if (state.phase === PHASE_MID_B) {
          if (state.phaseFrame === midABFrame(40) || state.phaseFrame === midABFrame(360)) spawnWaveA();
          if (state.phaseFrame === midABFrame(220)) spawnWaveAAlt();
          if (state.phaseFrame === midABFrame(130)) spawnWaveAFormationSweep();
          if (state.phaseFrame === midABFrame(500)) spawnWaveAFormationDrop();
          if (state.phaseFrame > midABFrame(620) && state.stageBossSpawnTimer < 0 && state.phaseEnemySpawned > 0) {
            state.stageBossSpawnTimer = midABFrame(90);
          }
          if (state.stageBossSpawnTimer >= 0) {
            state.stageBossSpawnTimer--;
          }
          if (state.stageBossSpawnTimer === 0) {
            changePhase(PHASE_STAGE_BOSS);
          }
        } else if (state.phase === PHASE_STAGE_BOSS) {
          if (!state.stageBossHasSpawned) {
            if (state.stageBossDeployTimer >= 0) {
              state.stageBossDeployTimer--;
            }
            if (state.stageBossDeployTimer === 0) {
              spawnStageBoss();
              state.stageBossHasSpawned = true;
              state.stageBossDeployTimer = -1;
            }
            return;
          }
          if (!state.enemies.some((e) => e.alive && e.type.startsWith('stageBoss'))) {
            state.transitionTimer = 220;
            changePhase(PHASE_CLEAR_TRANSITION);
            addScore(1000 * state.loop);
          }
        } else if (state.phase === PHASE_CLEAR_TRANSITION) {
          state.transitionTimer--;
          if (state.transitionTimer <= 0) {
            state.loop++;
            changePhase(PHASE_MID_A);
          }
        }
      }

      function updateEntities() {
        for (const e of state.enemies) {
          if (!e.alive) continue;
          e.update(e);
          if (e.y > H + 60 || e.x < -80 || e.x > W + 80) e.alive = false;
        }

        for (const b of state.playerBullets) {
          if (!b.alive) continue;
          b.y += b.vy;
          if (b.y < -10) b.alive = false;
        }

        for (const b of state.enemyBullets) {
          if (!b.alive) continue;
          b.x += b.vx;
          b.y += b.vy;
          if (b.x < -12 || b.y < -12 || b.x > W + 12 || b.y > H + 12) b.alive = false;
        }

        // collision: player bullets vs enemies
        for (const b of state.playerBullets) {
          if (!b.alive) continue;
          for (const e of state.enemies) {
            if (!e.alive) continue;
            const hitR = e.type.includes('Boss')
              ? ENEMY_HIT_RADIUS.boss
              : e.type === 'turret'
                ? ENEMY_HIT_RADIUS.turret
                : e.sizeClass === 'medium'
                  ? ENEMY_HIT_RADIUS.medium
                  : ENEMY_HIT_RADIUS.small;
            if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < hitR * hitR) {
              b.alive = false;
              e.hp -= 1;
              if (e.hp <= 0) {
                e.alive = false;
                addScore(e.value || 0);
                const isBoss = e.type.includes('Boss');
                if (!isBoss && (state.phase === PHASE_MID_A || state.phase === PHASE_MID_B)) {
                  state.phaseEnemyDefeated++;
                }
                spawnExplosion(e.x, e.y, {
                  count: isBoss ? 54 : 18,
                  speed: isBoss ? 4.2 : 2.8,
                  life: isBoss ? 55 : 32,
                  radius: isBoss ? 4 : 2.4,
                  colors: isBoss
                    ? ['#fff5ba', '#ff9f78', '#ff77b2', '#ffffff']
                    : ['#ffe2b9', '#ff95b7', '#fff7da']
                });
              } else {
                const isBoss = e.type.includes('Boss');
                spawnHitEffect(b.x, b.y, isBoss || e.sizeClass === 'medium');
                e.hitShake = isBoss ? 9 : 7;
                e.hitShakeMag = isBoss ? 4.2 : e.sizeClass === 'medium' ? 3 : 2.2;
              }
              break;
            }
          }
        }

        // collision: enemy bullets vs player
        if (!state.gameOver && player.respawnState === 'active' && player.invincible <= 0 && !player.debugInvincible) {
          for (const e of state.enemies) {
            if (!e.alive) continue;
            const hitR = e.type.includes('Boss')
              ? ENEMY_HIT_RADIUS.boss
              : e.type === 'turret'
                ? ENEMY_HIT_RADIUS.turret
                : e.sizeClass === 'medium'
                  ? ENEMY_HIT_RADIUS.medium
                  : ENEMY_HIT_RADIUS.small;
            const rr = (player.radius + hitR) ** 2;
            if (distanceSq(player, e) <= rr) {
              triggerPlayerDown();
              break;
            }
          }

          for (const b of state.enemyBullets) {
            if (!b.alive) continue;
            const rr = (player.radius + b.r) ** 2;
            if (distanceSq(player, b) <= rr) {
              b.alive = false;
              triggerPlayerDown();
              break;
            }
          }
        }

        for (const p of state.explosions) {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy = p.vy * 0.98 + p.gravity;
          p.age++;
        }

        for (const e of state.enemies) {
          if (e.hitShake > 0) e.hitShake--;
        }

        state.enemies = state.enemies.filter((e) => e.alive);
        state.playerBullets = state.playerBullets.filter((b) => b.alive);
        state.enemyBullets = state.enemyBullets.filter((b) => b.alive);
        state.explosions = state.explosions.filter((p) => p.age < p.life);
      }

      function drawAscii(lines, x, y, color, size = 16) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.font = `bold ${size}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < lines.length; i++) {
          ctx.fillText(lines[i], x, y + i * (size * 0.9) - (lines.length - 1) * size * 0.45);
        }
        ctx.restore();
      }

      function drawBossHp(hp, maxHp, color, label) {
        const x = 50;
        const y = 52;
        const w = W - 100;
        const ratio = clamp(hp / maxHp, 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(x, y, w, 10);
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w * ratio, 10);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.strokeRect(x, y, w, 10);
        ctx.fillStyle = '#fff';
        ctx.font = '12px monospace';
        ctx.fillText(label, x, y - 4);
      }

      function renderBackground() {
        ctx.fillStyle = '#050814';
        ctx.fillRect(0, 0, W, H);

        for (const s of state.stars) {
          s.y += s.s * 0.6;
          if (s.y > H) {
            s.y = -2;
            s.x = Math.random() * W;
          }
          ctx.fillStyle = `rgba(195,210,255,${0.35 + s.s * 0.2})`;
          ctx.fillRect(s.x, s.y, s.s, s.s);
        }
      }

      function render() {
        renderBackground();

        for (const b of state.playerBullets) {
          ctx.fillStyle = '#9ce6ff';
          ctx.fillRect(b.x - 1.5, b.y - 8, 3, 12);
        }

        for (const e of state.enemies) {
          if (e.hitShake > 0) {
            const shakeScale = e.hitShake / Math.max(1, e.hitShake + 2);
            const mag = e.hitShakeMag * shakeScale;
            const ox = (Math.random() - 0.5) * mag;
            const oy = (Math.random() - 0.5) * mag;
            ctx.save();
            ctx.translate(ox, oy);
            e.draw(e);
            ctx.restore();
          } else {
            e.draw(e);
          }
        }

        for (const b of state.enemyBullets) {
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const p of state.explosions) {
          const alpha = 1 - p.age / p.life;
          if (alpha <= 0) continue;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (0.7 + alpha * 0.8), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (player.respawnState !== 'waiting' && !(player.invincible > 0 && (Math.floor(state.frame / 6) % 2 === 0))) {
          const bodyColor = player.respawnState === 'entering' ? '#9fe7ff' : '#e4ecff';
          drawAscii([
            player.flash ? ' * ' : ' ^ ',
            '<A>',
            '/|\\'
          ], player.x, player.y, bodyColor, 15);
          if (player.respawnState === 'entering') {
            drawAscii([' | ', '/V\\'], player.x, player.y + 19, '#8db9ff', 12);
          }
        }

        // hitbox marker
        if (player.respawnState !== 'waiting') {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(player.x, player.y + 1, player.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        renderHud();
        renderOverlay();
      }

      function renderHud() {
        ctx.fillStyle = 'rgba(7,11,26,0.75)';
        ctx.fillRect(8, 8, W - 16, 30);
        ctx.fillStyle = '#d6e5ff';
        ctx.font = '14px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE ${state.score.toString().padStart(7, '0')}`, 16, 28);
        ctx.fillText(`LIFE ${'★'.repeat(Math.max(0, state.lives))}`, 190, 28);
        ctx.fillText(`PHASE ${phaseLabel(state.phase)}`, 270, 28);
        ctx.fillText(`LOOP ${state.loop}`, 16, 46);
        if (state.debugMode) {
          ctx.fillStyle = '#ffe37a';
          ctx.fillText('DEBUG INVINCIBLE', 92, 62);
        }
      }

      function renderOverlay() {
        if (state.phaseTextTimer > 0) {
          state.phaseTextTimer--;
          ctx.globalAlpha = Math.min(1, state.phaseTextTimer / 30);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 28px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`--- ${phaseLabel(state.phase)} ---`, W / 2, H / 2 - 70);
          ctx.globalAlpha = 1;
        }

        if (state.warningTimer > 0) {
          state.warningTimer--;
          if (Math.floor(state.warningTimer / 8) % 2 === 0) {
            ctx.fillStyle = '#ff5454';
            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('WARNING', W / 2, H / 2);
          }
        }

        if (state.phase === PHASE_CLEAR_TRANSITION) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.font = 'bold 36px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('STAGE CLEAR', W / 2, H / 2 - 10);
          ctx.font = 'bold 24px monospace';
          ctx.fillText(`LOOP ${state.loop + 1}`, W / 2, H / 2 + 30);
        }

        if (state.gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.68)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#ff9da8';
          ctx.textAlign = 'center';
          ctx.font = 'bold 46px monospace';
          ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
          ctx.font = '18px monospace';
          ctx.fillStyle = '#fff';
          ctx.fillText('Press R to Retry', W / 2, H / 2 + 20);
        }

        if (state.inTitle) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.font = 'bold 42px monospace';
          ctx.fillText('STARLIGHT', W / 2, 170);
          ctx.fillText('BARRAGE', W / 2, 218);

          const startBtn = titleButtons.start;
          const debugBtn = titleButtons.debug;
          ctx.font = 'bold 24px monospace';

          ctx.fillStyle = 'rgba(128,180,255,0.32)';
          ctx.fillRect(startBtn.x - startBtn.w / 2, startBtn.y - startBtn.h / 2, startBtn.w, startBtn.h);
          ctx.strokeStyle = '#8fd8ff';
          ctx.strokeRect(startBtn.x - startBtn.w / 2, startBtn.y - startBtn.h / 2, startBtn.w, startBtn.h);
          ctx.fillStyle = '#b9f2ff';
          ctx.fillText('game Start', startBtn.x, startBtn.y + 8);

          const debugHover =
            mouse.x >= debugBtn.x - debugBtn.w / 2 &&
            mouse.x <= debugBtn.x + debugBtn.w / 2 &&
            mouse.y >= debugBtn.y - debugBtn.h / 2 &&
            mouse.y <= debugBtn.y + debugBtn.h / 2;
          ctx.fillStyle = debugHover ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.07)';
          ctx.fillRect(debugBtn.x - debugBtn.w / 2, debugBtn.y - debugBtn.h / 2, debugBtn.w, debugBtn.h);
          ctx.strokeStyle = 'rgba(220,232,255,0.28)';
          ctx.strokeRect(debugBtn.x - debugBtn.w / 2, debugBtn.y - debugBtn.h / 2, debugBtn.w, debugBtn.h);
          ctx.fillStyle = debugHover ? '#dce8ff' : 'rgba(220,232,255,0.7)';
          ctx.font = '11px monospace';
          ctx.fillText('debug start', debugBtn.x, debugBtn.y + 3);

          ctx.fillStyle = '#cdd8f7';
          ctx.font = '14px monospace';
          ctx.fillText('Start: Space / Enter / Click', W / 2, 510);
        }
      }

      function updateTitle() {
        const confirmPressed = isPressed('Space') || isPressed('Enter');

        if (mouse.clicked) {
          const startBtn = titleButtons.start;
          const debugBtn = titleButtons.debug;
          const startHit =
            mouse.x >= startBtn.x - startBtn.w / 2 &&
            mouse.x <= startBtn.x + startBtn.w / 2 &&
            mouse.y >= startBtn.y - startBtn.h / 2 &&
            mouse.y <= startBtn.y + startBtn.h / 2;
          const debugHit =
            mouse.x >= debugBtn.x - debugBtn.w / 2 &&
            mouse.x <= debugBtn.x + debugBtn.w / 2 &&
            mouse.y >= debugBtn.y - debugBtn.h / 2 &&
            mouse.y <= debugBtn.y + debugBtn.h / 2;

          if (startHit) beginGame(false);
          else if (debugHit) beginGame(true);

          mouse.clicked = false;
        }

        if (confirmPressed) {
          beginGame(false);
        }
      }

      function tick() {
        state.frame++;

        if (state.inTitle) {
          updateTitle();
          render();
          for (const code of ['Space', 'Enter']) {
            prevKeys[code] = !!keys[code];
          }
          requestAnimationFrame(tick);
          return;
        }

        if (state.gameOver) {
          if (keys.KeyR) resetForRetry();
          render();
          requestAnimationFrame(tick);
          return;
        }

        updatePlayer();
        updatePhase();
        updateEntities();
        render();

        for (const code of ['Space', 'Enter']) {
          prevKeys[code] = !!keys[code];
        }

        requestAnimationFrame(tick);
      }

      changePhase(PHASE_MID_A);
      tick();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数独</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:12px;min-height:100dvh;box-sizing:border-box;display:grid;place-items:center}
    .app{background:#fff;padding:clamp(12px,2.5vw,20px);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.1);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column}
    h1{margin:0 0 12px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    #check{margin-left:auto}
    button,select{padding:8px 10px}
    .grid{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:0;border:2px solid #222;width:min(100%,calc(100dvh - 220px));aspect-ratio:1;align-self:center}
    .cell{width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:1px solid #ccc;text-align:center;font-size:20px}
    .cell.given{background:#e9efff;font-weight:bold}
    .cell.match{background:#fff6b3}
    .cell.err{background:#ffd9d9}
    .status{margin-top:10px;font-weight:bold}
    dialog{border:none;border-radius:10px;padding:16px 18px;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    dialog::backdrop{background:rgba(0,0,0,.35)}

    @media (max-width:600px){
      body{padding:8px}
      .controls button,.controls select{flex:1 1 auto}
      #check{margin-left:0}
      .grid{width:min(100%,calc(100dvh - 250px))}
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>数独</h1>
    <div class="controls">
      <select id="difficulty">
        <option value="35">Easy</option>
        <option value="45" selected>Medium</option>
        <option value="55">Hard</option>
      </select>
      <button id="newGame">新規ゲーム</button>
      <button id="reset">リセット</button>
      <button id="check">答え合わせ</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="status" class="status">進行中</div>
  </div>
  <dialog id="resultDialog">
    <p id="resultMessage"></p>
    <form method="dialog">
      <button>閉じる</button>
    </form>
  </dialog>
  <dialog id="confirmDialog">
    <p id="confirmMessage"></p>
    <div class="dialog-actions">
      <button id="confirmCancel" type="button">キャンセル</button>
      <button id="confirmOk" type="button">実行する</button>
    </div>
  </dialog>
  <script>
    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const difficultyEl = document.getElementById('difficulty');
    const resultDialogEl = document.getElementById('resultDialog');
    const resultMessageEl = document.getElementById('resultMessage');
    const confirmDialogEl = document.getElementById('confirmDialog');
    const confirmMessageEl = document.getElementById('confirmMessage');
    const confirmCancelEl = document.getElementById('confirmCancel');
    const confirmOkEl = document.getElementById('confirmOk');
    let solution = [], puzzle = [], initial = [];
    let highlightedNumber = null;

    function shuffled(nums){ return [...nums].sort(()=>Math.random()-0.5); }
    function valid(board,r,c,n){
      for(let i=0;i<9;i++) if(board[r][i]===n || board[i][c]===n) return false;
      const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
      for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(board[br+i][bc+j]===n) return false;
      return true;
    }
    function fill(board){
      for(let r=0;r<9;r++) for(let c=0;c<9;c++) if(board[r][c]===0){
        for(const n of shuffled([1,2,3,4,5,6,7,8,9])){
          if(valid(board,r,c,n)){ board[r][c]=n; if(fill(board)) return true; board[r][c]=0; }
        }
        return false;
      }
      return true;
    }
    function makePuzzle(emptyCount){
      const b = Array.from({length:9},()=>Array(9).fill(0));
      fill(b);
      solution = b.map(r=>[...r]);
      puzzle = b.map(r=>[...r]);
      let removed=0;
      while(removed<emptyCount){
        const r=Math.floor(Math.random()*9), c=Math.floor(Math.random()*9);
        if(puzzle[r][c]!==0){puzzle[r][c]=0;removed++;}
      }
      initial = puzzle.map(r=>[...r]);
    }
    function updateHighlights(number){
      highlightedNumber = number;
      const cells = [...document.querySelectorAll('.cell')];
      cells.forEach((cell, idx) => {
        cell.classList.remove('match');
        const r = Math.floor(idx / 9);
        const c = idx % 9;
        if(number && puzzle[r][c]===number) cell.classList.add('match');
      });
    }

    function render(){
      gridEl.innerHTML='';
      for(let r=0;r<9;r++) for(let c=0;c<9;c++){
        const input=document.createElement('input');
        input.className='cell';
        if(c===2||c===5) input.style.borderRight='2px solid #222';
        if(r===2||r===5) input.style.borderBottom='2px solid #222';
        const v=puzzle[r][c];
        if(v){ input.value=v; input.readOnly=true; input.classList.add('given'); }
        input.maxLength=1;
        input.addEventListener('click',()=>{
          const num = puzzle[r][c];
          updateHighlights(num || null);
        });
        input.addEventListener('input',()=>{
          input.classList.remove('err');
          const val = input.value.normalize('NFKC').replace(/[^1-9]/g,'');
          input.value=val;
          puzzle[r][c]=val?Number(val):0;
          updateHighlights(val ? Number(val) : null);
          statusEl.textContent='進行中';
        });
        gridEl.appendChild(input);
      }
      updateHighlights(null);
    }

    function showResultDialog(message){
      resultMessageEl.textContent = message;
      if(typeof resultDialogEl.showModal === 'function'){
        resultDialogEl.showModal();
      }else{
        window.alert(message);
      }
    }

    function showConfirmDialog(message){
      if(typeof confirmDialogEl.showModal !== 'function'){
        return Promise.resolve(window.confirm(message));
      }

      confirmMessageEl.textContent = message;
      confirmDialogEl.showModal();
      return new Promise((resolve)=>{
        const onCancel = () => {
          cleanup();
          confirmDialogEl.close();
          resolve(false);
        };
        const onOk = () => {
          cleanup();
          confirmDialogEl.close();
          resolve(true);
        };
        const cleanup = () => {
          confirmCancelEl.removeEventListener('click', onCancel);
          confirmOkEl.removeEventListener('click', onOk);
        };
        confirmCancelEl.addEventListener('click', onCancel);
        confirmOkEl.addEventListener('click', onOk);
      });
    }

    function check(){
      const cells=[...document.querySelectorAll('.cell')];
      cells.forEach(c=>c.classList.remove('err'));
      let ok=true, complete=true;
      for(let r=0;r<9;r++) for(let c=0;c<9;c++){
        const idx=r*9+c;
        if(!puzzle[r][c]){complete=false;ok=false;continue;}
        if(puzzle[r][c]!==solution[r][c]){ok=false;cells[idx].classList.add('err');}
      }
      statusEl.textContent = ok&&complete ? 'クリア！' : '誤りまたは未入力があります';
      if(ok&&complete) showResultDialog('おめでとうございます！数独をクリアしました。');
    }
    async function reset(){
      const shouldReset = await showConfirmDialog('現在の入力内容をリセットします。よろしいですか？');
      if(!shouldReset) return;
      puzzle=initial.map(r=>[...r]);
      render();
      statusEl.textContent='進行中';
    }

    async function newGame(shouldConfirm = true){
      if(shouldConfirm){
        const confirmed = await showConfirmDialog('新しいゲームを開始します。現在の入力内容は失われます。よろしいですか？');
        if(!confirmed) return;
      }
      makePuzzle(Number(difficultyEl.value));
      render();
      statusEl.textContent='進行中';
    }

    document.getElementById('newGame').onclick=()=>newGame(true);
    document.getElementById('check').onclick=check;
    document.getElementById('reset').onclick=reset;
    newGame(false);
  </script>
</body>
</html>
